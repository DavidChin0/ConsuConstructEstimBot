<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presupuesto Karla — Vista Experimental</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #111820;
      --surface2: #1a2332;
      --border: #2a3a50;
      --text: #e8edf5;
      --text-dim: #7a8ba0;
      --accent: #3b82f6;
      --chapter-col: #60a5fa;
      --total-col: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
    .badge { background: #f59e0b; color: #000; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .meta { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
    .totals { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; display: inline-flex; gap: 32px; }
    .total-item { text-align: center; }
    .total-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .total-value { font-size: 20px; font-weight: 700; color: var(--total-col); }
    .total-value.dim { color: var(--text-dim); font-size: 16px; }
    .capitulos { display: flex; flex-direction: column; gap: 12px; }
    .capitulo { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .cap-header { background: var(--surface2); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .cap-header:hover { background: #1e2a3d; }
    .cap-clave { color: var(--chapter-col); font-weight: 700; font-size: 14px; }
    .cap-nombre { color: var(--text); font-size: 13px; margin-left: 10px; }
    .cap-total { color: var(--total-col); font-weight: 700; font-size: 14px; }
    .cap-toggle { color: var(--text-dim); font-size: 12px; }
    .partidas { display: none; padding: 8px 16px 12px; }
    .partidas.open { display: block; }
    .partida { display: grid; grid-template-columns: 80px 1fr 70px 100px 100px; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; font-size: 12px; }
    .partida:last-child { border-bottom: none; }
    .partida-clave { color: var(--text-dim); font-family: monospace; font-size: 11px; }
    .partida-desc { color: var(--text); }
    .partida-ud { color: var(--text-dim); text-align: center; }
    .partida-qty { color: var(--text); text-align: right; font-family: monospace; }
    .partida-total { color: var(--total-col); text-align: right; font-weight: 600; font-family: monospace; }
    .partida:hover { background: rgba(255,255,255,0.03); }
    .grand-total { margin-top: 20px; background: linear-gradient(135deg, #065f46 0%, #064e3b 100%); border: 1px solid #10b981; border-radius: 10px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .grand-total-label { font-size: 14px; font-weight: 600; }
    .grand-total-value { font-size: 26px; font-weight: 800; color: #6ee7b7; font-family: monospace; }
    .loading { color: var(--text-dim); text-align: center; padding: 40px; }
    .error { background: #7f1d1d; border: 1px solid #ef4444; border-radius: 8px; padding: 16px; color: #fca5a5; }
    #json-debug { margin-top: 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: var(--text-dim); display: none; }
    #btn-debug { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 12px; }
    #btn-debug:hover { border-color: var(--text); color: var(--text); }
  </style>
</head>
<body>

<span class="badge">EXPERIMENTAL — NO PRODUCCION</span>

<div id="app">
  <div class="loading">Cargando presupuesto...</div>
</div>

<button id="btn-debug" onclick="document.getElementById('json-debug').style.display=document.getElementById('json-debug').style.display==='none'?'block':'none'">Debug JSON</button>
<div id="json-debug"></div>

<script>
const PRESUPUESTO_ID = "{{ presupuesto_id }}";
const API_BASE = "{{ api_base }}";

async function loadBudget() {
  try {
    const resp = await fetch(`${API_BASE}/presupuestos/${PRESUPUESTO_ID}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderBudget(data);
    document.getElementById('json-debug').textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error">Error: ${e.message}</div>`;
  }
}

function fmt(n) {
  return new Intl.NumberFormat('es-HN', { style: 'currency', currency: 'HNL', minimumFractionDigits: 2 }).format(n);
}

function renderBudget(data) {
  const totalDirecto = data.costo_directo;
  const refTotal = 998188.50;
  const pct = ((totalDirecto / refTotal) * 100 - 100).toFixed(1);

  let html = `
<h1>${data.nombre}</h1>
<div class="meta">Cliente: ${data.cliente} &nbsp;|&nbsp; Moneda: ${data.moneda} &nbsp;|&nbsp; Fecha: ${data.fecha}</div>

<div class="totals">
  <div class="total-item">
    <div class="total-label">Costo Directo</div>
    <div class="total-value">${fmt(totalDirecto)}</div>
  </div>
  <div class="total-item">
    <div class="total-label">Ref. Original</div>
    <div class="total-value dim">${fmt(refTotal)}</div>
  </div>
  <div class="total-item">
    <div class="total-label">vs Ref.</div>
    <div class="total-value dim">${pct}%</div>
  </div>
</div>

<div class="capitulos">
`;

  const capitulos = (data.capitulos || []).sort((a, b) => a.orden - b.orden);
  capitulos.forEach((cap, i) => {
    html += `
  <div class="capitulo">
    <div class="cap-header" onclick="toggleCap(this)">
      <span><span class="cap-clave">${cap.clave}</span> <span class="cap-nombre">${cap.nombre}</span></span>
      <span><span class="cap-total">${fmt(cap.total)}</span> <span class="cap-toggle">▸</span></span>
    </div>
    <div class="partidas" id="cap-${i}">
`;
    (cap.partidas || []).forEach(p => {
      html += `
      <div class="partida">
        <span class="partida-clave">${p.clave_csi}</span>
        <span class="partida-desc">${p.descripcion}</span>
        <span class="partida-ud">${p.unidad}</span>
        <span class="partida-qty">${p.cantidad.toFixed(2)}</span>
        <span class="partida-total">${fmt(p.total)}</span>
      </div>
`;
    });
    html += `    </div>
  </div>
`;
  });

  html += `
</div>

<div class="grand-total">
  <span class="grand-total-label">TOTAL PRESUPUESTO (PURO CSI)</span>
  <span class="grand-total-value">${fmt(totalDirecto)}</span>
</div>
`;

  document.getElementById('app').innerHTML = html;
}

function toggleCap(el) {
  const toggle = el.querySelector('.cap-toggle');
  const next = el.nextElementSibling;
  if (next && next.classList.contains('partidas')) {
    const isOpen = next.classList.contains('open');
    next.classList.toggle('open');
    toggle.textContent = isOpen ? '▸' : '▾';
  }
}

loadBudget();
</script>
</body>
</html>
